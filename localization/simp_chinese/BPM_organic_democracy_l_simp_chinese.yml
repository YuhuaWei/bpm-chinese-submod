 ################## ORGANIC DEMOCRACY
 
 law_organic_democracy: "有机民主"
 law_organic_democracy_desc: "各种传统的“器官”——如家庭、工作场所、市镇或社区——自行治理其事务，并选举代表进入立法机构。不存在任何政党或意识形态组织。"

 ideology_dop_organic_democrat: "有机民主主义者"
 ideology_dop_organic_democrat_desc: "#lore 该群体信仰一种以社会片段为基础、实行自我治理的有机民主，拥有充分的迁徙与结社自由。#!"


 ig_national_conservatives_catholic: "民族保守主义者"
 ig_national_conservatives_catholic_desc: "天主教民族保守主义者是一个名目繁多、观点各异的松散群体，但总体上处于天主教思想的右翼。他们主张拆除自由主义制度，代之以有机民主国家与法团主义。历史上这是一个宽泛的概念：从葡萄牙的国家法团主义萨拉查主义者，到法国保皇派的“法兰西行动”，再到意大利无产阶级的ANI，乃至奥地利乌托邦式的“社会浪漫派”和波兰分配主义的“青年民族派”，不一而足。"

