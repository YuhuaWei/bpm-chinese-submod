 concept_bpm_ig_is_organicist: "有机主义者"
 concept_bpm_ig_is_organicist_desc: "@ig_christian_democrats! #bold 基督教民主主义者#!、@ig_reactionaries! #bold 反动主义者#! 和 @ig_fascists! #bold 法西斯主义者#! [Concept('concept_interest_group', '利益集团')]。他们相信人类社会如同一个有机体，而个体的人如同有机体的细胞——寻求在国家中赋予这些细胞权力，或使其成为国家的一部分。"

