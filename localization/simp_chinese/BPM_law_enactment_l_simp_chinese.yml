 bpm_provisional_government_events.2.t: "磋商一项承诺"
 bpm_provisional_government_events.2.d: "我们可以向[SCOPE.gsInterestGroup('bpm_government_promise_ig').GetName]承诺通过一项其所期望的法律，以换取他们对通过[SCOPE.sLaw('bpm_currently_enacting_law').GetName]的支持。"
 bpm_provisional_government_events.2.f: "...法律理应总是信任人们去照料他们自身的利益，因为身处本地情境的他们，通常总能比立法者更准确地做出判断。\n\n——亚当·斯密，1776年"

