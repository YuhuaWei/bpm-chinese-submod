 POLITICAL_MOVEMENT_RADICALISM_TOOLTIP:3 "#header [PoliticalMovement.GetNameNoIcon]中的[concept_activism]#!\n有些运动需要 #v 10%#! 的支持才会起义，而另一些则需要 #v 15%#!。无政府主义者需要 #v 30%#! 才会爆发大规模自发起义。社会主义与共产主义运动则分别需要25与50的工人意识。\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(PoliticalMovement.GetRadicalism, '(CFixedPoint)0.5'), 'ACTIVISM_RED_ICON', 'ACTIVISM_ICON')] [LabelingHelper.GetLabelForRadicalism(PoliticalMovement.GetRadicalism)] ($POLITICAL_MOVEMENT_RADICALISM_WITHOUT_LABEL$)\n$TOOLTIP_DELIMITER$\n#title 预计这一$concept_activism_short$将朝 #b [LabelingHelper.GetLabelForRadicalism(PoliticalMovement.GetTargetRadicalism)]#! 漂移（#tooltippable #tooltip:[PoliticalMovement.GetTooltipTag],POLITICAL_MOVEMENT_RADICALISM_BREAKDOWN [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(PoliticalMovement.GetTargetRadicalism, '(CFixedPoint)1'), 'POLITICAL_MOVEMENT_TARGET_RADICALISM_WITHOUT_LABEL_RED', 'POLITICAL_MOVEMENT_TARGET_RADICALISM_WITHOUT_LABEL')]#!#!）：#! #indent_newline:3 \n[PoliticalMovement.GetTargetRadicalismDesc]"
